<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80">

  <!-- AD monogram -->
  <text x="4" y="62" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="64" fill="#C8653A">A</text>
  <text x="46" y="62" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="64" fill="#C8653A">D</text>

  <!-- Stethoscope tube -->
  <path d="M 86,50 Q 92,68 80,76 Q 65,84 46,76 Q 36,70 31,65"
        fill="none" stroke="#C8653A" stroke-width="4" stroke-linecap="round"/>

  <!-- Stethoscope head -->
  <circle cx="25" cy="68" r="7" fill="none" stroke="#C8653A" stroke-width="3.5"/>
  <circle cx="25" cy="68" r="2.5" fill="#C8653A"/>

  <!-- Vertical separator -->
  <line x1="104" y1="12" x2="104" y2="68" stroke="#D4957A" stroke-width="1"/>

  <!-- Doctor name -->
  <text x="118" y="32" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="21" fill="#1a1a1a">Dra. Ana Laura Díaz Poveda</text>

  <!-- MEDICINA GENERAL badge -->
  <rect x="118" y="42" width="168" height="24" rx="12" fill="#D4845A"/>
  <text x="202" y="59" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11.5" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">MEDICINA GENERAL</text>

</svg>
